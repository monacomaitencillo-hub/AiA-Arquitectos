<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIA Wiki — Ingresar</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#080c14" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AIA Wiki" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="login-page">
    <!-- Loading overlay shown while checking auth state -->
    <div id="loading-overlay">
      <div class="spinner"></div>
      <span>Verificando sesión...</span>
    </div>

    <div class="login-card" id="login-card" style="display:none">
      <div class="login-logo">
        <svg width="76" height="27" viewBox="0 0 90 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M2 30 L13 4 L24 30" stroke="#c9a76d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <line x1="7" y1="21" x2="19" y2="21" stroke="#c9a76d" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="45" cy="8" r="2.4" fill="#c9a76d"/>
          <line x1="45" y1="13" x2="45" y2="30" stroke="#c9a76d" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M66 30 L77 4 L88 30" stroke="#c9a76d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <line x1="71" y1="21" x2="83" y2="21" stroke="#c9a76d" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <h1>AIA Wiki</h1>
        <p>Sistema interno de reuniones</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email-input">Correo electrónico</label>
          <input
            id="email-input"
            type="email"
            autocomplete="email"
            placeholder="usuario@empresa.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password-input">Contraseña</label>
          <input
            id="password-input"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" class="btn-primary" id="login-btn">
          Ingresar
        </button>

        <div id="login-error" class="login-error" style="display:none"></div>
      </form>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAek0F64AeFDrOUgyGP-_c37X9CrqODVdM",
      authDomain: "aia-arquitectos-730e8.firebaseapp.com",
      projectId: "aia-arquitectos-730e8",
      storageBucket: "aia-arquitectos-730e8.firebasestorage.app",
      messagingSenderId: "996874189178",
      appId: "1:996874189178:web:5f61b3ee0155951a303ec3",
      measurementId: "G-69G7KP1V7N"
    };

    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();

    const loadingOverlay = document.getElementById('loading-overlay');
    const loginCard = document.getElementById('login-card');
    const loginForm = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-btn');
    const errorEl = document.getElementById('login-error');

    // Si se llega acá desde admin.html (?redirect=admin), después de loguear
    // hay que ir directo al panel de Administración, no a Reuniones.
    const redirectTarget = new URLSearchParams(location.search).get('redirect') === 'admin'
      ? 'app.html#admin'
      : 'app.html';

    // Check auth state first
    auth.onAuthStateChanged(user => {
      if (user) {
        window.location.href = redirectTarget;
        return;
      }
      loadingOverlay.style.display = 'none';
      loginCard.style.display = 'block';
    });

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }
    function hideError() {
      errorEl.style.display = 'none';
    }

    const ERROR_MESSAGES = {
      'auth/invalid-email': 'Correo electrónico inválido.',
      'auth/user-not-found': 'Credenciales incorrectas.',
      'auth/wrong-password': 'Credenciales incorrectas.',
      'auth/invalid-credential': 'Credenciales incorrectas.',
      'auth/too-many-requests': 'Demasiados intentos. Intenta más tarde.',
      'auth/user-disabled': 'Esta cuenta ha sido desactivada.',
    };

    loginForm.addEventListener('submit', async e => {
      e.preventDefault();
      hideError();

      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;

      if (!email || !password) {
        showError('Completá todos los campos.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Ingresando...';

      try {
        await auth.signInWithEmailAndPassword(email, password);
        // onAuthStateChanged will redirect
      } catch (err) {
        showError(ERROR_MESSAGES[err.code] || 'Error al ingresar. Verificá tus credenciales.');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Ingresar';
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
