<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIA Wiki — Ingresar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="login-page">
    <!-- Loading overlay shown while checking auth state -->
    <div id="loading-overlay">
      <div class="spinner"></div>
      <span>Verificando sesión...</span>
    </div>

    <div class="login-card" id="login-card" style="display:none">
      <div class="login-logo">
        <h1>AIA Wiki</h1>
        <p>Sistema interno de reuniones</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email-input">Correo electrónico</label>
          <input
            id="email-input"
            type="email"
            autocomplete="email"
            placeholder="usuario@empresa.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password-input">Contraseña</label>
          <input
            id="password-input"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" class="btn-primary" id="login-btn">
          Ingresar
        </button>

        <div id="login-error" class="login-error" style="display:none"></div>
      </form>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAek0F64AeFDrOUgyGP-_c37X9CrqODVdM",
      authDomain: "aia-arquitectos-730e8.firebaseapp.com",
      projectId: "aia-arquitectos-730e8",
      storageBucket: "aia-arquitectos-730e8.firebasestorage.app",
      messagingSenderId: "996874189178",
      appId: "1:996874189178:web:5f61b3ee0155951a303ec3",
      measurementId: "G-69G7KP1V7N"
    };

    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();

    const loadingOverlay = document.getElementById('loading-overlay');
    const loginCard = document.getElementById('login-card');
    const loginForm = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-btn');
    const errorEl = document.getElementById('login-error');

    // Check auth state first
    auth.onAuthStateChanged(user => {
      if (user) {
        window.location.href = 'app.html';
        return;
      }
      loadingOverlay.style.display = 'none';
      loginCard.style.display = 'block';
    });

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }
    function hideError() {
      errorEl.style.display = 'none';
    }

    const ERROR_MESSAGES = {
      'auth/invalid-email': 'Correo electrónico inválido.',
      'auth/user-not-found': 'Credenciales incorrectas.',
      'auth/wrong-password': 'Credenciales incorrectas.',
      'auth/invalid-credential': 'Credenciales incorrectas.',
      'auth/too-many-requests': 'Demasiados intentos. Intenta más tarde.',
      'auth/user-disabled': 'Esta cuenta ha sido desactivada.',
    };

    loginForm.addEventListener('submit', async e => {
      e.preventDefault();
      hideError();

      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;

      if (!email || !password) {
        showError('Completá todos los campos.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Ingresando...';

      try {
        await auth.signInWithEmailAndPassword(email, password);
        // onAuthStateChanged will redirect
      } catch (err) {
        showError(ERROR_MESSAGES[err.code] || 'Error al ingresar. Verificá tus credenciales.');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
